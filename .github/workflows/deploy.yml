name: Deploy to Amplify

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static page
        run: |
          python3 build.py
          cp full-doc-preview.html index.html
          zip build.zip index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::964376924380:role/neoaccounting-github-actions-deploy
          aws-region: eu-central-1

      - name: Deploy to Amplify
        run: |
          DEPLOYMENT=$(aws amplify create-deployment --app-id d2ifmhr1nmutri --branch-name main)
          JOB_ID=$(echo "$DEPLOYMENT" | jq -r '.jobId')
          ZIP_URL=$(echo "$DEPLOYMENT" | jq -r '.zipUploadUrl')
          curl -sSf -X PUT "$ZIP_URL" --data-binary @build.zip
          aws amplify start-deployment --app-id d2ifmhr1nmutri --branch-name main --job-id "$JOB_ID"
